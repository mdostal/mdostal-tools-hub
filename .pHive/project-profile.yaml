code_quality:
  linters:
    - name: eslint
      config_path: eslint.config.mjs
      lint_command: "pnpm lint"
      ecosystem: javascript
  formatters: []
  pre_commit:
    framework: null
    hooks: []
  code_snippets:
    - path: src/lib/tools.ts
      pattern: cms-with-fallback-data-layer
      annotation: "getTools() fetches from Sanity, falls back to a hardcoded FALLBACK_TOOLS snapshot on any failure -- shared by both the landing page and next.config.ts's rewrite generator so they never drift."
      lines: "150-163"
    - path: next.config.ts
      pattern: multi-zone-rewrite-generator
      annotation: "async rewrites() derives Vercel multi-zone proxy rules directly from getTools(), so publishing a tool in Sanity with live:true is enough to wire up routing -- no code change."
      lines: "25-31"
    - path: src/app/page.tsx
      pattern: react-server-component-landing-page
      annotation: "Server component composed of small presentational helpers (LiveBadge, OpenAndSourceLinks) driven entirely by ToolEntry data, no client-side state."
      lines: "1-40"
  test_first_signals:
    co_located_tests: false
    test_before_source: inconclusive
    test_runner_in_precommit: false
    bdd_keywords: false
    test_absence: true

project_maturity: production

north_star:
  goal: >
    Route tools.mdostal.com subpaths to independently-deployed personal tool
    projects with a shared, low-maintenance landing page. Evolving beyond
    manual Sanity entries into a GitHub auto-crawler: scan ALL public repos
    under the mdostal account, pull README + repo metadata, and generate a
    suggested Sanity "tool" entry (label/description/etc.) for human approval
    rather than auto-publishing unreviewed. Longer-term, package the crawler
    itself as a reusable, restylable tool other developers can point at their
    own GitHub account to auto-generate their own portfolio site -- this repo
    is both the live mdostal.com instance AND (eventually) the reference
    implementation/template for that reusable tool.
  audience: >
    Primary: Mathew Dostal (repo owner) and visitors to tools.mdostal.com.
    Secondary (future): other developers who adopt the crawler as a
    reusable/restylable tool to auto-generate their own GitHub-driven
    portfolio site.
  expected_scale: "unknown"
  pain_points: >
    Onboarding a new tool is still partly manual (screenshot capture, writing
    label/description by hand) even after the Sanity migration. Wants repo
    discovery and overview generation automated -- see goal.
  success: >
    v1: every public mdostal repo is scanned automatically and surfaced as a
    suggested entry for approval, not just the 4 tools currently listed by
    hand. v2: the crawler mechanism is generalized/restylable so someone else
    can retarget it at their own GitHub account and get their own
    auto-updating portfolio site.
  avoid: >
    No fully-automatic unreviewed publishing to the live site -- crawler
    output is a suggestion, human approves before it goes live (per explicit
    choice). Security: this repo is PUBLIC on GitHub -- never commit secrets;
    confirmed clean via kickoff audit (2026-08-13): no .env files tracked,
    ever, in history; .gitignore covers .env*; the only write-capable
    credential (SANITY_API_WRITE_TOKEN) is read from process.env, never
    hardcoded. Keep it that way -- any new crawler code needs a GitHub token
    for API rate limits, which must follow the same env-var-only pattern.

github_crawler_scope:
  # Captured 2026-08-13 during kickoff discovery -- feeds the future /plan
  # epic for this feature, not implemented yet.
  crawl_target: "All public repos under the mdostal GitHub account (v1). Later: any GitHub account/org, user-configurable, once generalized."
  auto_add_mode: "suggest-then-approve -- crawler proposes a Sanity tool doc, human reviews/publishes. No fully-automatic publish."
  runtime: "A script in this repo (same pattern as scripts/migrate-tools-to-sanity.mjs), run locally or on a schedule -- not a Sanity Studio plugin or GitHub Action, at least for v1."
  overview_source: "GitHub repo README + metadata (description, topics, languages) parsed into label/description fields -- not LLM-summarized for v1."
  reusability_direction: "Eventually restylable/config-driven so other developers can point the same crawler at their own GitHub account and get their own auto-updating portfolio -- this is a stated future direction, not yet scoped into stories."
