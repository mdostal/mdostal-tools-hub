project_name: "mdostal-tools-hub"
type: brownfield
discovered: "2026-08-13T00:20:34Z"
source: "codebase scan (no CLAUDE.md present)"

project_type: consumer-app
has_ui: true

ship_target:
  kind: vercel
  notes: "Deploys as tools.mdostal.com. Uses Vercel's multi-zone pattern -- this repo is the router/landing page; each tool is its own independently-deployed Vercel project proxied in via next.config.ts rewrites."

claude_md_summary: |
  No CLAUDE.md exists in this repo. Conventions below are inferred entirely
  from README.md, DESIGN-BRIEF.md, and codebase scan.

  Build/test/lint commands (from package.json, pnpm-based):
    - pnpm dev    -- next dev
    - pnpm build  -- next build
    - pnpm start  -- next start
    - pnpm lint   -- eslint
  No test command exists -- there are no test files in this repo.

  Core convention (from README.md "How a tool gets added"): a new tool ships
  as its own repo + Vercel project with its own next.config.ts basePath. This
  hub only needs one entry added via the Sanity Studio "tool" document type
  (no code change) -- src/lib/tools.ts's getTools() fetches from Sanity at
  build time and drives both the landing-page cards and the multi-zone
  rewrites in next.config.ts from the same data.

tech_stack:
  languages: [typescript]
  frameworks: [next.js, react, tailwindcss]
  build_tools: [pnpm, eslint]
  package_managers: [pnpm]
  versions:
    next: "16.2.12"
    react: "19.2.4"
    typescript: "^5"
    tailwindcss: "^4"
    node: "22 (per .github/workflows/ci.yml)"

structure:
  modules:
    - name: app
      purpose: Next.js App Router entry -- landing page, layout, icons
      source: src/app/
    - name: lib
      purpose: Sanity client + tool-list data layer, shared by the landing page and next.config.ts's rewrite generator
      source: src/lib/
    - name: scripts
      purpose: One-time/idempotent migration script to seed tool docs into Sanity
      source: scripts/
  entry_points:
    - src/app/page.tsx (landing page)
    - src/app/layout.tsx (root layout)
    - next.config.ts (multi-zone rewrite config, also reads getTools())

architecture:
  pattern: Next.js App Router, server components by default
  di_framework: none (small app, no DI container)
  state_management: none -- fully server-rendered, no client-side state library
  navigation: Next.js file-based routing + multi-zone rewrites (proxies /<mount>/* to each tool's own Vercel deployment)
  data_layer: >
    Single source of truth is the "tool" document type in a sibling Sanity
    project (mdostal/personal-site). src/lib/sanity.ts holds a read-only
    Sanity client (NEXT_PUBLIC_SANITY_PROJECT_ID / NEXT_PUBLIC_SANITY_DATASET
    env vars, never a write token). src/lib/tools.ts's getTools() fetches the
    tool list and falls back to a hardcoded FALLBACK_TOOLS snapshot if Sanity
    is unconfigured or the fetch fails -- so the site can never go fully dark
    over a CMS hiccup. Called from both src/app/page.tsx (cards) and
    next.config.ts (rewrites) so both stay in sync automatically.

conventions:
  naming: "PascalCase components, camelCase functions/vars, kebab-case tool mount paths"
  file_organization: "src/app for routes, src/lib for shared data/client logic; flat, no feature folders (small app)"
  branching: "Everything committed directly to main -- no feature branches observed in history"
  commit_messages: "Short, imperative, present-tense summary lines (e.g. 'Refresh drone-hub screenshot -- now 12 components/tools'); em-dash used for a trailing clarifying clause. No conventional-commits prefixes (feat:/fix:) used."

test_infrastructure:
