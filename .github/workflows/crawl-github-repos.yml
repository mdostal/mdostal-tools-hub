name: Crawl GitHub repos for tool suggestions

on:
  schedule:
    # Daily at 13:00 UTC (~9am ET). Suggestions land hidden -- nothing goes
    # live without a manual review + unhide in Sanity Studio.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/crawl-github-repos.mjs --write
        env:
          # Repository variables (Settings -> Secrets and variables -> Actions
          # -> Variables), not secrets -- a GitHub account name and a Sanity
          # project ID/dataset are meant to be public (see .env.example).
          # GitHub Actions rejects repo variable names starting with GITHUB_
          # (reserved prefix) -- CRAWL_GITHUB_ACCOUNT is the repo variable,
          # mapped here to the GITHUB_ACCOUNT env var the script reads.
          GITHUB_ACCOUNT: ${{ vars.CRAWL_GITHUB_ACCOUNT }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          # The Actions-provided token, not a PAT -- just here to raise the
          # GitHub API rate limit (5000/hr vs 60/hr unauthenticated), not for
          # any repo-write permission. See scripts/crawl-github-repos.mjs's
          # own header comment for what it's used for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
